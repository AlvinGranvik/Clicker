<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Anrgy man</title>
</head>

<body>
    <audio id="rocksmash" src="./audio/punch-a-rock-161647.mp3"></audio>
    <header class="hero">
        <div class="container hero-content">
            <div class="stroketext">
            <h1>Slå stenen</h1>
            <div class="lead">
                <p>Du är en grabb.</p>
                <p>Du gillar inte denna sten.</p>
                <p>Så du kommer att slå den.</p>
                </div>
            </div>
        </div>
    </header>
    <main class="container">
        <article class="game">
                <div class="game-hud">
            <div class="game-controls">
                <button id="game-button"><img id="myImage" src="img/punch1.webp"></button>
            </div>
            <div id="msgbox"></div>
            <div class="sidebar">
                <ul class="game-currency">
                    <li class="item">
                        <h3>Stenar <span id="money"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Stenar per slag: <span id="mpc"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Stenar per sekund: <span id="mps"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Gym supplements: <span id="upgrades"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Stenar slagna: <span id="numberOfClicks"></span></h3>
                    </li>
                </ul>
        <div class="gymborder"><div class="gymtext"><h2>Gympartihandlaren</h2></div></div>
            <div id="upgradelist"></div>
            </div>
        </div>
        </article>
    </main>

    <script src="js/clicker.js"></script>
</body>

</html>
