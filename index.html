<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Anrgy man</title>
</head>

<body>
    <audio id="swoosh" src="audio/607251__d4xx__swoosh-2.wav"></audio>
    <header class="hero">
        <picture>
            <source srcset="img/rockbackground.jpg">
            <source srcset="">
            <source srcset="">
            <source srcset="">
            <img src="" alt="">
        </picture>
        <div class="hero-gradient"></div>
        <div class="container hero-content">
            <h1>Slå stenen</h1>
            <div class="lead">
                <p>Du är en grabb.</p>
                <p>Du gillar inte denna sten.</p>
                <p>Så du kommer att slå den.</p>
            </div>
        </div>
    </header>
    <main class="container">
        <article class="game">
            <div class="game-hud">
                <ul class="game-currency">
                    <li class="item">
                        <h3>Stenar <span id="money"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Stenar per slag: <span id="mpc"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Stenar per sekund: <span id="mps"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Gym supplements: <span id="upgrades"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Stenar slagna: <span id="numberOfClicks"></span></h3>
                    </li>
                </ul>
                <div class="game-controls">
                    <button id="game-button"><img id="myImage" src="img/Standingman.png"></button>
                </div>
            </div>
            <div class="w-100">
                <div class="gymborder"><div class="gymtext">
                <h2>Gympartihandlaren</h2>
                </div>
                </div>
                <div id="upgradelist"></div>
            </div>
        </article>
    </main>
    <div id="msgbox"></div>
    <footer class="container footer">
            <p>Credits:</p>
            <ul>
                <li>
                    <a href="https://freesound.org/s/607251/">Ljudeffekt</a>
                </li>
                <li>
                    Hero photo retrieved from the website: <a href="https://www.drtrecycling.com.au/product/400mm-600mm-rocks/">drtrecycling</a>
            </ul>
        </div>
    </footer>
    <script src="js/clicker.js"></script>
</body>

</html>
